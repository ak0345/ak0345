name: Weekly renders

# Inference only. Both models are trained locally and their checkpoints are
# committed, so this job never trains - it re-solves the ODEs with a fresh seed
# and republishes the animations.
#
# Output goes to an orphan `renders` branch that is force-pushed each run.
# Committing ~2 MB of GIFs to main on a schedule would add roughly a gigabyte a
# year to the clone size, permanently, because git keeps every version. The
# orphan branch is reset every time, so history never accumulates.

on:
  schedule:
    # Mondays, 03:17 UTC. Off the hour on purpose: :00 is the most contended
    # slot on GitHub's scheduler and jobs there are routinely delayed.
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: renders
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            flow-matching-2d/requirements.txt
            flow-matching-sphere/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r flow-matching-2d/requirements.txt
          pip install -r flow-matching-sphere/requirements.txt

      - name: Render coupling comparison
        working-directory: flow-matching-2d
        run: |
          python render.py \
            --checkpoint checkpoints/caffeine_ind.pt:"independent coupling" \
            --checkpoint checkpoints/caffeine_ot.pt:"minibatch OT coupling" \
            --limit 4.0 --limit-y 2.9 \
            --out ../out/flow_dark.gif

      - name: Render sphere
        working-directory: flow-matching-sphere
        run: |
          python render.py \
            --checkpoint checkpoints/sphere.pt \
            --out ../out/sphere_dark.gif

      - name: Report sizes
        run: |
          ls -lh out/
          # A README image over ~2 MB is slow on mobile; fail loudly rather than
          # silently shipping something nobody waits for.
          for f in out/*.gif; do
            size=$(stat -c%s "$f")
            if [ "$size" -gt 2200000 ]; then
              echo "::error::$f is $((size/1024)) KB, over the 2 MB budget"
              exit 1
            fi
          done

      - name: Publish to the renders branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          echo "Generated by .github/workflows/renders.yml - force-pushed, do not edit." > README.md
          git init -q -b renders
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "renders $(date -u +'%Y-%m-%d')"
          git push --force -q \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" renders
          echo "Published $(ls *.gif | tr '\n' ' ')to the renders branch."