name: Daily flow-matching render

on:
  schedule:
    # 03:17 UTC - deliberately off the hour; :00 is the busiest slot on
    # GitHub's scheduler and jobs there are routinely delayed or dropped.
    - cron: "17 3 * * *"
  workflow_dispatch: # lets you trigger a render by hand from the Actions tab

permissions:
  contents: write # required for the bot to push the regenerated GIF

concurrency:
  group: flow-daily
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: flow-matching-2d/requirements.txt

      - name: Install dependencies
        run: pip install -r flow-matching-2d/requirements.txt

      - name: Render
        working-directory: flow-matching-2d
        run: |
          python render.py \
            --checkpoint checkpoints/vector_field.pt \
            --out ../assets/flow_dark.gif

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/flow_dark.gif
          if git diff --staged --quiet; then
            echo "No change - nothing to commit."
          else
            git commit -m "chore: daily flow-matching render [skip ci]"
            git push
          fi
